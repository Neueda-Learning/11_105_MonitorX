services:
  db:
    image: mysql:8.4
    container_name: monitorx-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: monitorx_root
      MYSQL_DATABASE: monitorxdb
      MYSQL_USER: monitorx
      MYSQL_PASSWORD: monitorx
    ports:
      - "3306:3306"
    volumes:
      - monitorx_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: monitorx-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: monitorxdb
      DB_USERNAME: monitorx
      DB_PASSWORD: monitorx
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: monitorx-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8081:80"

volumes:
  monitorx_db_data:
