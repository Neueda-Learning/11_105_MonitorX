# MySQL Database configuration (active when spring.profiles.active=mysql)
# Set these environment variables before starting the app:
#   DB_HOST       (default: localhost)
#   DB_PORT       (default: 3306)
#   DB_NAME       (default: monitorxdb)
#   DB_USERNAME   (default: root)
#   DB_PASSWORD   (required)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:monitorxdb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:n3u3da!}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
